; FFT Teensy firmware - channel selected by USB serial number in src/main.cpp
; Connected USB Serial target:
;   VID=16C0 PID=0483 SN=16102920
; Current board roles:
;   RIGHT=16102920 (connected now)
;   LEFT=19236400 (placeholder until left board is added)
;   SLAVE=18946530
[env:teensy_fft]
platform = teensy
board = teensy40
framework = arduino

build_flags =
    -D USB_SERIAL
    -D LAYOUT_US_ENGLISH
    -O2
    -std=gnu++17

monitor_speed = 115200
monitor_filters = direct
monitor_port = /dev/cu.usbmodem161029201
targets = upload
upload_protocol = custom
; Pin upload target to FFT RIGHT board by USB serial number
upload_command = /Users/kellyphillipps/bin/tycmd upload -B 16102920 $SOURCE

lib_deps =
    fastled/FastLED@^3.7.8
    https://github.com/PaulStoffregen/Audio.git
    https://github.com/PaulStoffregen/SD.git
