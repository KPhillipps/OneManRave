[env:teensy_led]
platform = teensy
board = teensy40
framework = arduino
board_build.usb_type = serial
build_src_filter = +<*> -<backup/*>
extra_scripts = pre:kill_serial_monitor.py

build_flags =
    -D USB_SERIAL
    -D DEBUG_SERIAL=0
    -D DEBUG_STATUS=0
    -D SERIAL1_RX_BUFFER_SIZE=1024
    -D LAYOUT_US_ENGLISH
    -O2
    -std=gnu++17
    -I include

monitor_speed = 115200
monitor_raw = yes
upload_protocol = custom
; Upload to first detected Teensy and let tycmd report real failures.
; (Previous config masked failures with `|| true` and could appear successful without flashing.)
upload_command = ~/bin/tycmd upload $SOURCE

lib_deps =
    fastled/FastLED@^3.7.8
