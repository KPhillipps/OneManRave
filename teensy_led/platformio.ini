; ============================================================================
; teensy_led — LED Display Controller (Teensy 4.0)
; ----------------------------------------------------------------------------
; Two physical boards, two PlatformIO environments. Pick one explicitly:
;
;   pio run -e teensy_led_left  -t upload    # WS2812B strips (LEFT panel)
;   pio run -e teensy_led_right -t upload    # APA102  strips (RIGHT panel)
;
; Each environment sets exactly one BOARD_* build flag. main.cpp / Globals.h
; #ifdef on those flags so the wrong-chipset code path can never run on a
; board (the unused branch isn't even compiled in).
;
; Both environments share platform/framework/serial config via [env].
;
; Default environment (what the VSCode "Upload" button / bare `pio run` uses)
; is the LEFT panel. Safe to leave this way because the left env is pinned
; by tycmd serial to 19169950-Teensy, so it will fail loudly if the left
; board isn't connected - it can never accidentally flash the right board.
; ============================================================================

[platformio]
default_envs = teensy_led_left

[env]
platform = teensy
board = teensy40
framework = arduino
board_build.usb_type = serial
build_src_filter = +<*> -<backup/*>
extra_scripts = pre:kill_serial_monitor.py
monitor_speed = 115200
monitor_raw = yes
upload_protocol = custom

build_flags =
    -D USB_SERIAL
    -D DEBUG_SERIAL=0
    -D DEBUG_STATUS=0
    -D SERIAL1_RX_BUFFER_SIZE=1024
    -D LAYOUT_US_ENGLISH
    -O2
    -std=gnu++17
    -I include

lib_deps =
    fastled/FastLED@^3.7.8

; ============================================================================
; LEFT panel — WS2812B (single-wire, 800 kHz) driven via FastLED's
; OCTOWS2811 controller for parallel DMA output. 8 fixed octo channels
; (pins 2,14,7,8,6,20,21,5); 6 of them are wired on this board, ch5/ch7
; are unused but their buffer slots still exist (LED_BUFFER_SIZE = 2304).
;
; Upload pinned by USB serial. LEFT LED Teensy tag from `tycmd list`
; (confirmed 2026-04-20, board in HalfKay at time of capture): 19169950-Teensy
; Note: one digit off from the RIGHT board's 19159950 - easy to misread.
; ============================================================================
[env:teensy_led_left]
build_flags =
    ${env.build_flags}
    -D BOARD_LEFT_WS2812B
    -D USE_OCTOWS2811
lib_deps =
    ${env.lib_deps}
    PaulStoffregen/OctoWS2811
upload_command = ~/bin/tycmd upload -B 19169950-Teensy $SOURCE

; ============================================================================
; RIGHT panel — APA102 (4-wire SPI) driven by FastLED. 6 data pins
; {6,7,2,21,5,8} share a single clock on pin 14. Each data line goes through
; a 74HCT245 buffer/level-shifter on the LED Teensy carrier board; that
; buffer's OE pin is on Teensy pin 3 (BUFFER_ENABLE) and MUST be driven
; HIGH at boot or the RJ45 cables see nothing. main.cpp handles this in
; setup() under #ifdef BOARD_RIGHT_APA102.
;
; Upload pinned by USB serial so this only ever flashes the right LED board.
; RIGHT LED Teensy tag from `tycmd list`: 19159950-Teensy
; ============================================================================
[env:teensy_led_right]
build_flags =
    ${env.build_flags}
    -D BOARD_RIGHT_APA102
upload_command = ~/bin/tycmd upload -B 19159950-Teensy $SOURCE
